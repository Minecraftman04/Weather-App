<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Static GitHub Pages weather dashboard with rain nowcast and a dedicated MachX launch-weather view." />
  <title>Weather Dashboard</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #06131a; color: #f5fbff; font-family: system-ui, sans-serif; }
    #loading { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
    #loading strong { font-size: 1.1rem; }
    #loading p { color: #a8bfca; }
  </style>
</head>
<body>
  <div id="loading"><div><strong>Loading weather dashboard…</strong><p>The forecast interface will appear shortly.</p></div></div>
  <script>
  (async () => {
    const response = await fetch("./app-source.html", { cache: "no-cache" });
    if (!response.ok) throw new Error(`Could not load app source (${response.status}).`);
    let html = await response.text();

    const replacements = [
      [
        '<meta name="description" content="Static GitHub Pages weather dashboard with rain nowcast, winds aloft, OpenRocket export, and MachX launch-window helper." />',
        '<meta name="description" content="Static GitHub Pages weather dashboard with rain nowcast and a dedicated MachX launch-weather view." />'
      ],
      ['<title>Weather + Winds Aloft</title>', '<title>Weather Dashboard</title>'],
      ['<h1>Weather + Winds Aloft</h1>', '<h1>Weather Dashboard</h1>'],
      [
        '<p class="subtitle">A GitHub Pages weather dashboard for live surface forecasts, rain timing, sea-level pressure, winds aloft to 3000 m AGL, OpenRocket wind export, and MachX launch-window checks.</p>',
        '<p class="subtitle">A GitHub Pages weather dashboard for live surface forecasts, rain timing, sea-level pressure, and dedicated MachX launch-weather checks.</p>'
      ],
      [
        '          <span class="heroStat">Winds aloft graph</span>\n          <span class="heroStat">OpenRocket CSV</span>',
        '          <span class="heroStat">MachX launch windows</span>'
      ],
      [
        '<div class="field"><label for="aloftStepSelect">Aloft step</label><select id="aloftStepSelect">',
        '<div class="field" id="aloftStepField" hidden><label for="aloftStepSelect">Aloft step</label><select id="aloftStepSelect">'
      ],
      ['<section class="mainDataGrid" aria-label="Winds aloft and nowcast">', '<section class="mainDataGrid" aria-label="Forecast details">'],
      ['<article class="card" id="aloftCard"><h2>Winds aloft</h2>', '<article class="card" id="aloftCard" hidden><h2>Winds aloft</h2>'],
      [
        '    aloftStepSelect: document.getElementById("aloftStepSelect"),',
        '    aloftStepSelect: document.getElementById("aloftStepSelect"),\n    aloftStepField: document.getElementById("aloftStepField"),'
      ],
      [
        '      const [surface, aloftPack] = await Promise.all([fetchJson(surfaceUrl(loc)), loadAloftWithFallback(loc)]);',
        '      const needsAloft = loc.launchSite === "machx";\n      const [surface, aloftPack] = await Promise.all([\n        fetchJson(surfaceUrl(loc)),\n        needsAloft ? loadAloftWithFallback(loc) : Promise.resolve({ data: null, levels: [], warning: "" })\n      ]);'
      ],
      [
        '  function applyLocationMode() {\n    const launchOnly = isMachXLaunchLocation();\n    el.overviewGrid.hidden = launchOnly;\n    el.aloftCard.hidden = launchOnly;\n    el.minuteRainCard.hidden = launchOnly;\n    el.hourlyCard.hidden = launchOnly;\n    el.launchWindowCard.hidden = !launchOnly;\n  }\n  function renderAll() {\n    applyLocationMode();\n    if (isMachXLaunchLocation()) {\n      renderLaunchWindow();\n      return;\n    }\n    renderCurrent();\n    renderDaily();\n    renderMinuteRain();\n    renderAloft();\n    renderHourly();\n  }',
        '  function applyLocationMode() {\n    const machXMode = isMachXLaunchLocation();\n    el.overviewGrid.hidden = machXMode;\n    el.aloftCard.hidden = !machXMode;\n    el.aloftStepField.hidden = !machXMode;\n    el.minuteRainCard.hidden = machXMode;\n    el.hourlyCard.hidden = machXMode;\n    el.launchWindowCard.hidden = !machXMode;\n  }\n  function renderAll() {\n    applyLocationMode();\n    if (isMachXLaunchLocation()) {\n      renderAloft();\n      renderLaunchWindow();\n      return;\n    }\n    renderCurrent();\n    renderDaily();\n    renderMinuteRain();\n    renderHourly();\n  }'
      ]
    ];

    for (const [before, after] of replacements) {
      const first = html.indexOf(before);
      if (first === -1 || html.indexOf(before, first + before.length) !== -1) {
        throw new Error(`App patch did not find exactly one expected section: ${before.slice(0, 80)}`);
      }
      html = html.replace(before, after);
    }

    document.open();
    document.write(html);
    document.close();
  })().catch(error => {
    console.error(error);
    const loading = document.getElementById("loading");
    if (loading) loading.innerHTML = `<div><strong>Weather dashboard failed to load.</strong><p>${String(error.message || error)}</p></div>`;
  });
  </script>
</body>
</html>
