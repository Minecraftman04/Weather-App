name: Apply GitHub location sync integration

on:
  push:
    branches:
      - agent/github-location-sync
    paths:
      - github-sync.js
      - data/saved-locations.json
      - GITHUB-SYNC.md
      - scripts/apply_github_sync.py
      - .github/workflows/apply-github-location-sync.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Add sync script to the dashboard
        run: python scripts/apply_github_sync.py

      - name: Remove one-shot integration files
        run: |
          rm scripts/apply_github_sync.py
          rm .github/workflows/apply-github-location-sync.yml

      - name: Commit integrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes were needed."
            exit 0
          fi
          git commit -m "Integrate GitHub-backed location sync"
          git push
