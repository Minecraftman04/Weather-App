name: Check main Pages deployment

on:
  push:
    paths:
      - .github/workflows/check-main-pages-deployment.yml

permissions:
  actions: read
  contents: read
  deployments: read
  issues: write
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify target deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 96aa9f90b572191752a9a59e26ee2a94a9b7dd8c
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          site='{}'
          build='{}'
          for attempt in $(seq 1 36); do
            site=$(curl -fsS "${auth[@]}" "${api}/pages")
            build=$(curl -fsS "${auth[@]}" "${api}/pages/builds/latest")
            build_sha=$(jq -r '.commit // ""' <<<"$build")
            build_status=$(jq -r '.status // "unknown"' <<<"$build")
            if [ "$build_sha" = "$TARGET_SHA" ] && [ "$build_status" != "building" ] && [ "$build_status" != "queued" ]; then
              break
            fi
            sleep 5
          done

          deployments=$(curl -fsS "${auth[@]}" "${api}/deployments?environment=github-pages&per_page=20")
          deployment_id=$(jq -r --arg sha "$TARGET_SHA" '[.[] | select(.sha == $sha)][0].id // empty' <<<"$deployments")
          deployment_status='not-found'
          deployment_description=''
          deployment_log_url=''
          if [ -n "$deployment_id" ]; then
            statuses=$(curl -fsS "${auth[@]}" "${api}/deployments/${deployment_id}/statuses?per_page=20")
            deployment_status=$(jq -r '.[0].state // "unknown"' <<<"$statuses")
            deployment_description=$(jq -r '.[0].description // ""' <<<"$statuses")
            deployment_log_url=$(jq -r '.[0].log_url // ""' <<<"$statuses")
          fi

          site_url=$(jq -r '.html_url // "unknown"' <<<"$site")
          site_status=$(jq -r '.status // "unknown"' <<<"$site")
          source_branch=$(jq -r '.source.branch // "unknown"' <<<"$site")
          source_path=$(jq -r '.source.path // "unknown"' <<<"$site")
          build_sha=$(jq -r '.commit // "unknown"' <<<"$build")
          build_status=$(jq -r '.status // "unknown"' <<<"$build")
          build_error=$(jq -r '.error.message // ""' <<<"$build")
          body=$(cat <<EOF
          Verification of the clean GitHub Pages redeployment.

          - Target commit: ${TARGET_SHA}
          - Pages URL: ${site_url}
          - Pages source: ${source_branch}${source_path}
          - Site status: ${site_status}
          - Latest build commit: ${build_sha}
          - Latest build status: ${build_status}
          - Build error: ${build_error:-none}
          - Deployment ID: ${deployment_id:-not found}
          - Deployment status: ${deployment_status}
          - Deployment description: ${deployment_description:-none}
          - Deployment log: ${deployment_log_url:-none}
          EOF
          )

          curl -fsS -X POST "${auth[@]}" "${api}/issues" \
            -d "$(jq -n --arg title 'Temporary clean Pages deployment verification' --arg body "$body" '{title:$title, body:$body}')" >/dev/null
