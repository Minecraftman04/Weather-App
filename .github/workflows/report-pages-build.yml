name: Report latest GitHub Pages build

on:
  push:
    paths:
      - .github/workflows/report-pages-build.yml

permissions:
  contents: read
  pages: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this commit's Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          latest='{}'
          site='{}'
          for attempt in $(seq 1 30); do
            site=$(curl -sS "${headers[@]}" "${repo_api}/pages")
            latest=$(curl -sS "${headers[@]}" "${repo_api}/pages/builds/latest")
            commit=$(printf '%s' "$latest" | jq -r '.commit // ""')
            status=$(printf '%s' "$latest" | jq -r '.status // "unknown"')
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" != "building" ] && [ "$status" != "queued" ]; then
              break
            fi
            sleep 5
          done

          site_status=$(printf '%s' "$site" | jq -r '.status // "unknown"')
          site_url=$(printf '%s' "$site" | jq -r '.html_url // "unknown"')
          build_status=$(printf '%s' "$latest" | jq -r '.status // "unknown"')
          build_commit=$(printf '%s' "$latest" | jq -r '.commit // "unknown"')
          build_error=$(printf '%s' "$latest" | jq -r '.error.message // ""')
          created=$(printf '%s' "$latest" | jq -r '.created_at // "unknown"')
          updated=$(printf '%s' "$latest" | jq -r '.updated_at // "unknown"')

          body=$(cat <<EOF
          Temporary deployment diagnostic.

          - Site URL: ${site_url}
          - Site status: ${site_status}
          - Build status: ${build_status}
          - Build commit: ${build_commit}
          - Expected commit: ${GITHUB_SHA}
          - Created: ${created}
          - Updated: ${updated}
          - Error: ${build_error:-none}
          EOF
          )

          curl -sS -X POST "${headers[@]}" "${repo_api}/issues" \
            -d "$(jq -n --arg title 'Temporary GitHub Pages deployment diagnostic' --arg body "$body" '{title:$title, body:$body}')" >/dev/null
