name: Remove extra saved locations

on:
  push:
    paths:
      - .github/workflows/remove-extra-saved-locations.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Machrihanish and Campbeltown Airport buttons
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          lines = [
              '          <button class="savedLocationBtn" data-saved-name="Machrihanish" data-saved-admin2="Argyll and Bute" data-saved-admin1="Scotland" data-saved-country="United Kingdom" data-saved-lat="55.4234" data-saved-lon="-5.7357" type="button">Machrihanish</button>\n',
              '          <button class="savedLocationBtn" data-saved-name="Campbeltown Airport" data-saved-admin2="Argyll and Bute" data-saved-admin1="Scotland" data-saved-country="United Kingdom" data-saved-lat="55.4372" data-saved-lon="-5.6864" type="button">Campbeltown Airport</button>\n',
          ]
          for line in lines:
              if text.count(line) != 1:
                  raise RuntimeError(f"Expected one exact saved-location line: {line.strip()}")
              text = text.replace(line, "", 1)

          if 'data-saved-name="Mach X"' not in text:
              raise RuntimeError("Mach X saved location was unexpectedly removed")
          path.write_text(text, encoding="utf-8")

      - name: Validate application
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          assert 'data-saved-name="Machrihanish"' not in text
          assert 'data-saved-name="Campbeltown Airport"' not in text
          assert 'data-saved-name="Mach X"' in text
          script = re.search(r'<script>\s*(.*?)\s*</script>', text, re.S)
          assert script
          Path('/tmp/weather-app.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/weather-app.js

      - name: Commit update and remove updater
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-extra-saved-locations.yml
          git commit -m "Remove extra saved locations"
          git push
