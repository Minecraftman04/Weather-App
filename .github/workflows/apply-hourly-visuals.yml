name: Apply hourly forecast visuals

on:
  push:
    paths:
      - .github/workflows/apply-hourly-visuals.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/add-hourly-visuals.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          required = ['function weatherIconSvg', 'class="hourlyTable"', 'rainMeter', 'cloudMeter', 'visibilityQuality']
          for item in required:
              assert item in text, item
          script = re.search(r'<script>\s*(.*?)\s*</script>', text, re.S)
          assert script
          Path('/tmp/weather-app.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/weather-app.js
      - name: Commit update and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm tools/add-hourly-visuals.py .github/workflows/apply-hourly-visuals.yml
          git commit -m "Add visual icons to hourly forecast"
          git push
