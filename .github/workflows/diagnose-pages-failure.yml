name: Diagnose failed Pages deployment

on:
  push:
    paths:
      - .github/workflows/diagnose-pages-failure.yml

permissions:
  deployments: read
  issues: write
  pages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read deployment details
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: 5314043783
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          h1="Accept: application/vnd.github+json"
          h2="Authorization: Bearer ${GH_TOKEN}"
          h3="X-GitHub-Api-Version: 2022-11-28"
          site=$(curl -fsS -H "$h1" -H "$h2" -H "$h3" "$api/pages")
          deployment=$(curl -fsS -H "$h1" -H "$h2" -H "$h3" "$api/deployments/$DEPLOYMENT_ID")
          statuses=$(curl -fsS -H "$h1" -H "$h2" -H "$h3" "$api/deployments/$DEPLOYMENT_ID/statuses?per_page=20")
          latest=$(printf '%s' "$statuses" | jq '.[0] // {}')
          body="Deployment ID: $DEPLOYMENT_ID
Deployment commit: $(printf '%s' "$deployment" | jq -r '.sha // "unknown"')
Site URL: $(printf '%s' "$site" | jq -r '.html_url // "unknown"')
Site status: $(printf '%s' "$site" | jq -r '.status // "unknown"')
Deployment state: $(printf '%s' "$latest" | jq -r '.state // "unknown"')
Description: $(printf '%s' "$latest" | jq -r '.description // "none"')
Log URL: $(printf '%s' "$latest" | jq -r '.log_url // "none"')
Environment URL: $(printf '%s' "$latest" | jq -r '.environment_url // "none"')"
          payload=$(jq -n --arg title 'Failed Pages deployment diagnostic' --arg body "$body" '{title:$title,body:$body}')
          curl -fsS -X POST -H "$h1" -H "$h2" -H "$h3" "$api/issues" -d "$payload" >/dev/null
