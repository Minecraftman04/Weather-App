name: Apply wide-screen layout

on:
  push:
    paths:
      - .github/workflows/apply-wide-screen-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/wide-layout.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          for item in ['@media (min-width: 1600px)','@media (min-width: 2400px)','width: min(3200px','width: min(1800px']:
              assert item in text,item
          m=re.search(r'<script>\s*(.*?)\s*</script>',text,re.S)
          assert m
          Path('/tmp/weather-app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/weather-app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm tools/wide-layout.py .github/workflows/apply-wide-screen-layout.yml
          git commit -m "Scale dashboard for wide screens"
          git push
