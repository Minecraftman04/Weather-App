name: Verify wide-screen GitHub Pages deployment

on:
  push:
    paths:
      - .github/workflows/verify-latest-pages.yml

permissions:
  deployments: read
  issues: write
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for final Pages result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          site='{}'; build='{}'; latest='{}'; deployment_id=''; deployment_state='not-found'
          failures_after_build=0

          for attempt in $(seq 1 90); do
            site=$(curl -fsS "${headers[@]}" "$api/pages")
            build=$(curl -fsS "${headers[@]}" "$api/pages/builds/latest")
            deployments=$(curl -fsS "${headers[@]}" "$api/deployments?environment=github-pages&per_page=50")
            deployment_id=$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.sha == $sha)][0].id // empty' <<<"$deployments")
            latest='{}'; deployment_state='not-found'
            if [ -n "$deployment_id" ]; then
              statuses=$(curl -fsS "${headers[@]}" "$api/deployments/$deployment_id/statuses?per_page=20")
              latest=$(jq '.[0] // {}' <<<"$statuses")
              deployment_state=$(jq -r '.state // "unknown"' <<<"$latest")
            fi

            build_sha=$(jq -r '.commit // ""' <<<"$build")
            build_status=$(jq -r '.status // "unknown"' <<<"$build")
            if [ "$build_sha" = "$GITHUB_SHA" ] && [ "$build_status" = "built" ]; then
              if [ "$deployment_state" = "success" ]; then break; fi
              if [ "$deployment_state" = "failure" ] || [ "$deployment_state" = "error" ]; then
                failures_after_build=$((failures_after_build + 1))
                if [ "$failures_after_build" -ge 6 ]; then break; fi
              fi
            fi
            sleep 10
          done

          body=$(cat <<EOF
          Wide-screen GitHub Pages deployment verification.

          - Commit: ${GITHUB_SHA}
          - Pages URL: $(jq -r '.html_url // "unknown"' <<<"$site")
          - Pages source: $(jq -r '.source.branch // "unknown"' <<<"$site")$(jq -r '.source.path // ""' <<<"$site")
          - Site status: $(jq -r '.status // "unknown"' <<<"$site")
          - Latest build commit: $(jq -r '.commit // "unknown"' <<<"$build")
          - Latest build status: $(jq -r '.status // "unknown"' <<<"$build")
          - Build error: $(jq -r '.error.message // "none"' <<<"$build")
          - Deployment ID: ${deployment_id:-not found}
          - Deployment status: ${deployment_state}
          - Deployment description: $(jq -r '.description // "none"' <<<"$latest")
          - Deployment log: $(jq -r '.log_url // "none"' <<<"$latest")
          EOF
          )
          payload=$(jq -n --arg title 'Wide-screen Pages deployment verification' --arg body "$body" '{title:$title,body:$body}')
          curl -fsS -X POST "${headers[@]}" "$api/issues" -d "$payload" >/dev/null
